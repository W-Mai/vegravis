name: Github Pages

# By default, runs if you push to master. keeps your deployed app in sync with master branch.
on:
  push:
    branches:
      - master
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write # for committing to gh-pages branch.

jobs:
  build-github-pages:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve installer release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "download_path=latest/download" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "$RELEASE_TAG" != "$latest_tag" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "download_path=download/${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4 # repo checkout
        if: steps.release.outputs.ready == 'true'
      - name: Setup toolchain for wasm
        if: steps.release.outputs.ready == 'true'
        run: |
          rustup update stable
          rustup default stable
          rustup set profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Rust Cache # cache the rust build artefacts
        if: steps.release.outputs.ready == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Download and install Trunk binary
        if: steps.release.outputs.ready == 'true'
        run: wget -qO- https://github.com/thedodd/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
      - name: Build # build
        if: steps.release.outputs.ready == 'true'
        # Environment $public_url resolves to the github project page.
        # If using a user/organization page, remove the `${{ github.event.repository.name }}` part.
        # using --public-url something will allow trunk to modify all the href paths like from favicon.ico to repo_name/favicon.ico .
        # this is necessary for github pages where the site is deployed to username.github.io/repo_name and all files must be requested
        # relatively as eframe_template/favicon.ico. if we skip public-url option, the href paths will instead request username.github.io/favicon.ico which
        # will obviously return error 404 not found.
        run: ./trunk build --release
        env:
          public_url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Fetch shell installer
        if: steps.release.outputs.ready == 'true'
        env:
          INSTALLER_DOWNLOAD_PATH: ${{ steps.release.outputs.download_path }}
        run: |
          curl -fsSL --retry 3 "https://github.com/${GITHUB_REPOSITORY}/releases/${INSTALLER_DOWNLOAD_PATH}/vegravis-installer.sh" -o dist/install.sh
          test -s dist/install.sh
          chmod +x dist/install.sh
      - name: Deploy
        if: steps.release.outputs.ready == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          # this option will not maintain any history of your previous pages deployment
          # set to false if you want all page build to be committed to your gh-pages branch history
          single-commit: true
